name: Build

# One pipeline for everything: every push builds the app, the installer DMG and the
# update zip; a push of a v* tag additionally publishes them as a GitHub release. The
# publish steps live in the same run as the build, so nothing gets released unless the
# build that produced it passed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and (re)publish, e.g. v1.2.0"
        required: false

permissions:
  contents: write

jobs:
  build:
    # `scripts/release.sh` pushes the release commit and its tag, and GitHub starts a
    # run per ref. Skip the branch-push copy of a release commit so a release shows up
    # as exactly one run — the tag one, which is the run that publishes.
    if: >-
      github.event_name != 'push'
      || startsWith(github.ref, 'refs/tags/v')
      || !startsWith(github.event.head_commit.message, 'chore: release v')
    # arm64 runner: the app is Apple Silicon only.
    runs-on: macos-15
    env:
      # `secrets` is not readable from a step-level `if`, so surface it as job env.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Decide whether this run publishes
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ] || \
             [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: vendor/whisper.cpp
          # Keyed on the pinned commit inside the bootstrap script.
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/bootstrap_whisper.sh') }}

      - name: Build whisper.cpp
        run: ./scripts/bootstrap_whisper.sh

      # Optional: sign with the same self-signed identity used locally, so updates keep
      # the user's Microphone/Accessibility grants. Without these secrets the build is
      # ad-hoc signed and macOS re-asks for permissions after each update.
      # Create them with scripts/export_signing_secrets.sh.
      - name: Import signing identity
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # A self-signed identity must be trusted for code signing or codesign
          # refuses to build a chain. The runner is ephemeral, so trusting it in the
          # system keychain is safe here.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys \
            -passin pass:"$MACOS_CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"

      - name: Build app, DMG and update zip
        # The DMG window layout comes from the committed scripts/dmg/DS_Store — there is
        # no Finder session on the runner to author one.
        run: ./scripts/build_app.sh

      - name: Verify the bundle
        run: |
          codesign --verify --deep dist/AlejoVoice.app
          # No LaunchAgent plist any more: launch at login is a plain login item
          # (SMAppService.mainApp), because a launchd-owned process never gets the
          # TCC prompts. See LoginAgent.
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            dist/AlejoVoice.app/Contents/Info.plist

      - name: Upload build artifacts
        # Lets a plain push (or PR) be downloaded and tried without cutting a release.
        uses: actions/upload-artifact@v4
        with:
          name: AlejoVoice-${{ steps.version.outputs.value }}
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 14

      - name: Add version-less copies
        if: steps.mode.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        # GitHub serves /releases/latest/download/<asset> as a permanent link to the
        # newest release, but only if the file name never changes. These copies are
        # what the download button and the updater point at — no moving git tag needed.
        run: |
          cp "dist/AlejoVoice-$VERSION-arm64.dmg" dist/AlejoVoice-arm64.dmg
          cp "dist/AlejoVoice-$VERSION-arm64.zip" dist/AlejoVoice-arm64.zip

      - name: Publish release
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          NOTES=$(cat <<EOF
          **Instalación nueva:** descarga \`AlejoVoice-$VERSION-arm64.dmg\`, ábrelo y haz doble clic en **Instalar AlejoVoice** — copia la app a Aplicaciones y le quita la marca de cuarentena.

          Si macOS bloquea también el instalador: clic derecho → *Abrir*. La app no está notarizada (eso requiere cuenta de developer de pago), así que Gatekeeper la rechaza mientras tenga la marca del navegador.

          **Ya lo tienes instalado:** no descargues nada — AlejoVoice → Ajustes → *Buscar actualizaciones* (esa vía no pasa por Gatekeeper).

          macOS 13+, Apple Silicon. El \`.zip\` es el payload que usa el updater interno.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.zip \
              --title "AlejoVoice $VERSION" --notes "$NOTES"
          fi
